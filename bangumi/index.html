	(function() {

		const TOKEN_KEY = 'blog_token';

		function readHashToken() {
			const hash = window.location.hash || '';
			const match = hash.match(/(?:^#|&)token=([^&]+)/);
			if (!match) return null;
			try {

		function getAuthToken() {

	const initSettingsModal = () => {
		const modal = document.getElementById('settings-modal');
		const modalClose = document.getElementById('settings-modal-close');
		const settingsAvatar = document.getElementById('settings-avatar');
		const settingsUsername = document.getElementById('settings-username');
		const settingsLogin = document.getElementById('settings-login');

		const openModal = async () => {
			if (!modal) return;

			// Fetch current user info
			const { getCurrentUser } = window.__auth || {};
			if (getCurrentUser) {
				try {
					const user = await getCurrentUser();
					if (user) {
						if (settingsAvatar && user.avatar) settingsAvatar.src = user.avatar;
						if (settingsUsername) settingsUsername.textContent = user.username || 'User';
						if (settingsLogin) settingsLogin.textContent = '@' + (user.login || user.username || 'user');
					}
				} catch (e) {
					console.error('Failed to load user info:', e);
				}
			}

			requestAnimationFrame(() => {
				modal.classList.remove('opacity-0', 'invisible');
				modal.classList.add('opacity-100');
				const content = modal.querySelector('.modal-content');
				if (content) {
					content.classList.remove('scale-95', 'opacity-0');
					content.classList.add('scale-100', 'opacity-100');
				}
				modal.setAttribute('aria-hidden', 'false');
			});
		};

		const closeModal = () => {
			if (!modal) return;
			modal.classList.remove('opacity-100');
			modal.classList.add('opacity-0');
			const content = modal.querySelector('.modal-content');
			if (content) {
				content.classList.remove('scale-100', 'opacity-100');
				content.classList.add('scale-95', 'opacity-0');
			}
			setTimeout(() => modal.classList.add('invisible'), 200);
			modal.setAttribute('aria-hidden', 'true');
		};

		// Listen for custom open-settings event
		modal?.addEventListener('open-settings', openModal);

		// Close on backdrop click
		modal?.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

		// Close on close button click
		modalClose?.addEventListener('click', closeModal);

		// Close on Escape key
		document.addEventListener('keydown', (e) => {
			if (e.key === 'Escape' && modal && !modal.classList.contains('invisible')) closeModal();
		});
	};

	initSettingsModal();
	document.addEventListener('astro:page-load', initSettingsModal);
	document.addEventListener('astro:after-swap', initSettingsModal);
</script>  <script>
(function() {
	const initAuthButton = async () => {
		const { storeTokenFromHash, getCurrentUser, logout } = window.__auth || {};
		if (!storeTokenFromHash || !getCurrentUser || !logout) {
			setTimeout(initAuthButton, 100);
			return;
		}

		if (window.__authInitialized) return;
		window.__authInitialized = true;

		const loginButton = document.getElementById('auth-button');
		const userDropdown = document.getElementById('user-dropdown');
		const userAvatar = document.getElementById('user-avatar');
		const userName = document.getElementById('user-name');
		const userDropdownButton = document.getElementById('user-dropdown-button');
		const userDropdownMenu = document.getElementById('user-dropdown-menu');
		const logoutButton = document.getElementById('logout-button');
		const modal = document.getElementById('login-modal');
		const modalClose = document.getElementById('login-modal-close');

		const openModal = () => {
			if (!modal) return;
			requestAnimationFrame(() => {
				modal.classList.remove('opacity-0', 'invisible');
				modal.classList.add('opacity-100');
				const content = modal.querySelector('.modal-content');
				if (content) {
					content.classList.remove('scale-95', 'opacity-0');
					content.classList.add('scale-100', 'opacity-100');
				}
				modal.setAttribute('aria-hidden', 'false');
			});
		};

		const closeModal = () => {
			if (!modal) return;
			modal.classList.remove('opacity-100');
			modal.classList.add('opacity-0');
			const content = modal.querySelector('.modal-content');
			if (content) {
				content.classList.remove('scale-100', 'opacity-100');
				content.classList.add('scale-95', 'opacity-0');
			}
			setTimeout(() => modal.classList.add('invisible'), 200);
			modal.setAttribute('aria-hidden', 'true');
		};

		const toggleDropdown = () => {
			if (!userDropdownButton || !userDropdownMenu) return;
			const isExpanded = userDropdownButton.getAttribute('aria-expanded') === 'true';
			userDropdownButton.setAttribute('aria-expanded', String(!isExpanded));
			if (isExpanded) {
				userDropdownMenu.classList.add('opacity-0', 'invisible');
				userDropdownMenu.classList.remove('opacity-100', 'visible');
			} else {
				userDropdownMenu.classList.remove('opacity-0', 'invisible');
				userDropdownMenu.classList.add('opacity-100', 'visible');
			}
		};

		const closeDropdown = () => {
			if (!userDropdownButton || !userDropdownMenu) return;
			userDropdownButton.setAttribute('aria-expanded', 'false');
			userDropdownMenu.classList.add('opacity-0', 'invisible');
			userDropdownMenu.classList.remove('opacity-100', 'visible');
		};

		modal?.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
		modalClose?.addEventListener('click', closeModal);
		document.addEventListener('keydown', (e) => {
			if (e.key === 'Escape' && modal && !modal.classList.contains('invisible')) closeModal();
		});

		// Bind dropdown toggle click (only once)
		if (userDropdownButton && !userDropdownButton.dataset.bound) {
			userDropdownButton.dataset.bound = 'true';
			userDropdownButton.addEventListener('click', (e) => {
				e.stopPropagation();
				e.preventDefault();
				toggleDropdown();
			});
		}

		// Bind document click to close dropdown (only once)
		if (!window.__dropdownClickBound) {
			window.__dropdownClickBound = true;
			document.addEventListener('click', (e) => {
				if (userDropdown && !userDropdown.contains(e.target)) closeDropdown();
			});
		}

		try {
			storeTokenFromHash();
			const user = await getCurrentUser();

			if (user) {
				if (loginButton) loginButton.style.display = 'none';
				if (userDropdown) userDropdown.classList.remove('hidden');
				if (userAvatar && user.avatar) userAvatar.src = user.avatar;
				if (userName) userName.textContent = user.username || 'User';
				const dropdownAvatar = document.getElementById('dropdown-user-avatar');
				if (dropdownAvatar && user.avatar) dropdownAvatar.src = user.avatar;

				// Bind logout button (only once)
				if (logoutButton && !logoutButton.dataset.bound) {
					logoutButton.dataset.bound = 'true';
					logoutButton.addEventListener('click', async () => {
						closeDropdown();
						await logout();
						window.__authInitialized = false;
						window.location.reload();
					});
				}

				// Bind settings button (only once)
				const settingsButton = document.getElementById('settings-button');
				if (settingsButton && !settingsButton.dataset.bound) {
					settingsButton.dataset.bound = 'true';
					settingsButton.addEventListener('click', () => {
						closeDropdown();
						document.getElementById('settings-modal')?.dispatchEvent(new CustomEvent('open-settings'));
					});
				}
			} else {
				if (loginButton) loginButton.style.display = 'inline-flex';
				if (userDropdown) userDropdown.classList.add('hidden');
				// Bind login button (only once)
				if (loginButton && !loginButton.dataset.bound) {
					loginButton.dataset.bound = 'true';
					loginButton.addEventListener('click', openModal);
				}
			}
		} catch (error) {
			console.error('Auth error:', error);
			if (loginButton) loginButton.style.display = 'inline-flex';
			if (userDropdown) userDropdown.classList.add('hidden');
			if (loginButton && !loginButton.dataset.bound) {
				loginButton.dataset.bound = 'true';
				loginButton.addEventListener('click', openModal);
			}
		}
	};

	document.addEventListener('astro:page-load', () => {
		window.__authInitialized = false;
		initAuthButton();
	});

	initAuthButton();

	const initThemeToggle = () => {
		const buttons = Array.from(document.querySelectorAll('[id="theme-toggle"], [id="theme-toggle-mobile"]'));
		if (!buttons.length) return;

		const root = document.documentElement;
		const storageKey = 'theme';
		const updateAria = () => {
			const isDark = root.classList.contains('dark');
			buttons.forEach((button) => {
				button.setAttribute('aria-pressed', String(isDark));
				const icon = button.querySelector('[data-theme-icon]');
				if (icon) {
					icon.classList.toggle('rotate-180', isDark);
				}
			});
		};

		buttons.forEach((button) => {
			if (button.dataset.bound === 'true') return;
			button.dataset.bound = 'true';
			button.addEventListener('click', () => {
				const isDark = root.classList.toggle('dark');
				root.dataset.theme = isDark ? 'dark' : 'light';
				localStorage.setItem(storageKey, isDark ? 'dark' : 'light');
				updateAria();
			});
		});

		updateAria();
	};

	initThemeToggle();
	// Rebind on client-side navigation because header can be re-rendered by View Transitions.
	document.addEventListener('astro:page-load', initThemeToggle);
	document.addEventListener('astro:after-swap', initThemeToggle);

	const initMobileDrawer = () => {
		const trigger = document.getElementById('mobile-menu-button');
		const drawer = document.getElementById('mobile-drawer');
		const overlay = document.getElementById('mobile-overlay');
		const closeBtn = document.getElementById('mobile-menu-close');
		// Avoid duplicate listeners after client-side route swaps.
		if (!trigger || !drawer || !overlay || !closeBtn || trigger.dataset.drawerBound === 'true') return;
		trigger.dataset.drawerBound = 'true';
		const TRANSITION_MS = 220;
		let closeTimer = null;

		const forceClosedState = () => {
			drawer.classList.add('-translate-x-full', 'hidden');
			drawer.classList.remove('translate-x-0');
			drawer.setAttribute('aria-hidden', 'true');
			overlay.classList.add('opacity-0', 'pointer-events-none', 'hidden');
			overlay.classList.remove('opacity-100', 'pointer-events-auto');
			document.documentElement.classList.remove('overflow-hidden');
			trigger.setAttribute('aria-expanded', 'false');
		};

		const setOpenVisualState = () => {
			drawer.classList.remove('-translate-x-full');
			drawer.classList.add('translate-x-0');
			overlay.classList.remove('opacity-0', 'pointer-events-none');
			overlay.classList.add('opacity-100', 'pointer-events-auto');
		};

		const closeDrawer = () => {
			if (closeTimer) {
				clearTimeout(closeTimer);
				closeTimer = null;
			}
			trigger.setAttribute('aria-expanded', 'false');
			drawer.setAttribute('aria-hidden', 'true');
			drawer.classList.add('-translate-x-full');
			drawer.classList.remove('translate-x-0');
			overlay.classList.add('opacity-0', 'pointer-events-none');
			overlay.classList.remove('opacity-100', 'pointer-events-auto');
			document.documentElement.classList.remove('overflow-hidden');
			closeTimer = window.setTimeout(() => {
				drawer.classList.add('hidden');
				overlay.classList.add('hidden');
				closeTimer = null;
			}, TRANSITION_MS);
		};

		const openDrawer = () => {
			if (closeTimer) {
				clearTimeout(closeTimer);
				closeTimer = null;
			}
			trigger.setAttribute('aria-expanded', 'true');
			drawer.setAttribute('aria-hidden', 'false');
			drawer.classList.remove('hidden');
			overlay.classList.remove('hidden');
			document.documentElement.classList.add('overflow-hidden');
			// Defer transform class toggle to next frame so transition runs reliably.
			window.requestAnimationFrame(setOpenVisualState);
		};

		trigger.addEventListener('click', openDrawer);
		closeBtn.addEventListener('click', closeDrawer);
		overlay.addEventListener('click', closeDrawer);

		const drawerLinks = drawer.querySelectorAll('[data-drawer-link]');
		for (const link of drawerLinks) {
			link.addEventListener('click', closeDrawer);
		}

		// Initialize mobile nav toggles
		const navGroups = drawer.querySelectorAll('[data-mobile-nav-group]');
		for (const group of navGroups) {
			const toggle = group.querySelector('[data-mobile-nav-toggle]');
			const children = group.querySelector('.mobile-nav-children');
			const arrow = group.querySelector('.mobile-nav-arrow');
			
			if (toggle && children && arrow) {
				toggle.addEventListener('click', () => {
					const isExpanded = toggle.getAttribute('aria-expanded') === 'true';
					toggle.setAttribute('aria-expanded', String(!isExpanded));
					children.classList.toggle('hidden');
					arrow.classList.toggle('rotate-180');
				});
			}
		}

		forceClosedState();
	};

	if (document.documentElement.dataset.drawerEscBound !== 'true') {
		document.addEventListener('keydown', (event) => {
			if (event.key !== 'Escape') return;
			const trigger = document.getElementById('mobile-menu-button');
			const drawer = document.getElementById('mobile-drawer');
			const overlay = document.getElementById('mobile-overlay');
			if (!trigger || !drawer || !overlay || trigger.getAttribute('aria-expanded') !== 'true') return;

			trigger.setAttribute('aria-expanded', 'false');
			drawer.setAttribute('aria-hidden', 'true');
			drawer.classList.add('-translate-x-full');
			drawer.classList.remove('translate-x-0');
			overlay.classList.add('opacity-0', 'pointer-events-none');
			overlay.classList.remove('opacity-100', 'pointer-events-auto');
			document.documentElement.classList.remove('overflow-hidden');
			window.setTimeout(() => {
				drawer.classList.add('hidden');
				overlay.classList.add('hidden');
			}, 220);
		});
		// Bound once globally; avoids stacking ESC handlers across route transitions.
		document.documentElement.dataset.drawerEscBound = 'true';
	}

	// Defensive: ensure scroll is unlocked when leaving page
	window.addEventListener('pagehide', () => {
		document.documentElement.classList.remove('overflow-hidden');
	});

	initMobileDrawer();
	document.addEventListener('astro:page-load', initMobileDrawer);
	document.addEventListener('astro:after-swap', initMobileDrawer);
