name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # 获取完整 git 历史

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Check for blog post changes
              id: check_changes
              run: |
                  # 获取上次提交和当前提交之间 blog 目录的变更
                  if git diff --name-only HEAD^ HEAD | grep -q "^src/content/blog/"; then
                    echo "Blog posts changed"
                    echo "posts_changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "No blog posts changed"
                    echo "posts_changed=false" >> $GITHUB_OUTPUT
                  fi

                  # 显示变更的文件
                  echo "Changed files:"
                  git diff --name-only HEAD^ HEAD | grep "^src/content/blog/" || echo "No blog changes"

            - name: Generate git history
              if: steps.check_changes.outputs.posts_changed == 'true'
              run: |
                  echo "Generating git history for blog posts..."
                  node scripts/generate-git-history.mjs

                  # 检查是否有变更
                  if git diff --quiet src/json/git-history.json; then
                    echo "No changes to git-history.json"
                  else
                    echo "Git history updated"
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git add src/json/git-history.json
                    git commit -m "chore: update git history for blog posts [skip ci]"
                    git push
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Build with Astro
              run: npm run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
