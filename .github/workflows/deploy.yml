name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Check for blog post changes
              id: check_changes
              run: |
                  if git diff --name-only HEAD^ HEAD | grep -q "^src/content/blog/"; then
                    echo "Blog posts changed"
                    echo "posts_changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "No blog posts changed"
                    echo "posts_changed=false" >> $GITHUB_OUTPUT
                  fi

                  echo "Changed files:"
                  git diff --name-only HEAD^ HEAD | grep "^src/content/blog/" || echo "No blog changes"

            - name: Generate git history
              if: steps.check_changes.outputs.posts_changed == 'true'
              run: |
                  echo "Generating git history for blog posts..."
                  node scripts/generate-git-history.mjs

                  if git diff --quiet src/json/git-history.json; then
                    echo "No changes to git-history.json"
                  else
                    echo "Git history updated"
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git add src/json/git-history.json
                    git commit -m "chore: update git history for blog posts [skip ci]"
                    git push
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Build with Astro
              run: npm run build

            - name: Deploy to gh-pages branch
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  publish_branch: gh-pages
                  force_orphan: true
          
          # 清空当前分支内容
          git rm -rf .
          
          # 从 dist 复制构建产物
          cp -r dist/* .
          
          # 添加所有文件
          git add .
          
          # 提交
          git commit -m "deploy: update build from main ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes to commit"
          
          # 强制推送到 pages 分支
          git push origin pages --force
