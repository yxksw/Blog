name: Build and Generate Git History

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: build
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Check for blog post changes
              id: check_changes
              run: |
                  if git diff --name-only HEAD^ HEAD | grep -q "^src/content/blog/"; then
                    echo "Blog posts changed"
                    echo "posts_changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "No blog posts changed"
                    echo "posts_changed=false" >> $GITHUB_OUTPUT
                  fi

                  echo "Changed files:"
                  git diff --name-only HEAD^ HEAD | grep "^src/content/blog/" || echo "No blog changes"

            - name: Generate git history
              if: steps.check_changes.outputs.posts_changed == 'true'
              run: |
                  echo "Generating git history for blog posts..."
                  node scripts/generate-git-history.mjs

                  if git diff --quiet src/json/git-history.json; then
                    echo "No changes to git-history.json"
                  else
                    echo "Git history updated"
                    git config user.name "Blog Admin"
                    git config user.email "admin@blog.com"
                    git add src/json/git-history.json
                    git commit -m "chore: update git history for blog posts"
                    git push
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Build with Astro
              run: npm run build

            # Cloudflare Pages 会自动从 GitHub 仓库构建和部署
            # 无需在此工作流中额外配置
